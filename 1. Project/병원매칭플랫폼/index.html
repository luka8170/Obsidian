<style>
/* Layout: 상단 증상 입력 → 좌측 필터 + 우측 매칭 결과 목록, 병원 선택 시 하단 시트에서 예약 요청 */
:root {
  --bg: #f3f6f6;
  --surface: #ffffff;
  --ink: #12292b;
  --muted: #5b7073;
  --line: #d9e3e3;
  --brand: #0b6e6e;
  --brand-ink: #ffffff;
  --brand-soft: #dff0ee;
  --alert: #d4472f;
  --alert-soft: #fbe6e1;
  --ok: #1f8a4c;
  --ok-soft: #dff3e6;
  --font-body: "IBM Plex Sans KR", "Noto Sans KR", system-ui, sans-serif;
  --font-data: "IBM Plex Mono", ui-monospace, monospace;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #0e1a1b; --surface: #152526; --ink: #e6f0ef; --muted: #8fa8a9; --line: #274042;
    --brand: #4fc3bd; --brand-ink: #062123; --brand-soft: #173b3b;
    --alert: #ff8a73; --alert-soft: #3d1f1a; --ok: #5fd08b; --ok-soft: #173a25;
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #0e1a1b; --surface: #152526; --ink: #e6f0ef; --muted: #8fa8a9; --line: #274042;
  --brand: #4fc3bd; --brand-ink: #062123; --brand-soft: #173b3b;
  --alert: #ff8a73; --alert-soft: #3d1f1a; --ok: #5fd08b; --ok-soft: #173a25;
  color-scheme: dark;
}
* { box-sizing: border-box; }
body { background: var(--bg); color: var(--ink); font-family: var(--font-body); font-size: 15px; line-height: 1.6; padding-block: 0 48px; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); }
.wrap { max-width: 1120px; margin: 0 auto; }
button, input, select, textarea { font: inherit; color: inherit; }
:focus-visible { outline: 2px solid var(--brand); outline-offset: 2px; }

header.top { padding-block: 28px 20px; display: grid; gap: 16px; }
.brand { display: flex; align-items: baseline; gap: 12px; flex-wrap: wrap; }
.brand h1 { margin: 0; font-size: 1.5rem; font-weight: 700; letter-spacing: -0.02em; }
.brand span { color: var(--muted); font-size: 0.875rem; }
.sample-note { font-size: 0.8125rem; color: var(--muted); border: 1px dashed var(--line); padding: 6px 10px; border-radius: 6px; }
.emergency { background: var(--alert-soft); color: var(--alert); padding: 10px 14px; border-radius: 8px; font-weight: 500; font-size: 0.9375rem; }
.emergency b { font-family: var(--font-data); }

.finder { background: var(--surface); border: 1px solid var(--line); border-radius: 12px; padding: 18px; display: grid; gap: 14px; }
.finder label.lbl { font-weight: 600; font-size: 0.9375rem; }
.symptom-row { display: flex; gap: 8px; flex-wrap: wrap; }
.symptom-row input { flex: 1 1 260px; min-width: 0; padding: 12px 14px; border: 1px solid var(--line); border-radius: 8px; background: var(--bg); }
.btn { border: 0; background: var(--brand); color: var(--brand-ink); padding: 12px 20px; border-radius: 8px; font-weight: 600; cursor: pointer; }
.btn:hover { filter: brightness(1.08); }
.btn.ghost { background: transparent; color: var(--brand); border: 1px solid var(--brand); }
.chips { display: flex; gap: 6px; flex-wrap: wrap; }
.chip { border: 1px solid var(--line); background: var(--surface); padding: 4px 12px; border-radius: 999px; font-size: 0.8125rem; cursor: pointer; color: var(--muted); }
.chip:hover { border-color: var(--brand); color: var(--brand); }
.reco { background: var(--brand-soft); border-radius: 8px; padding: 10px 14px; font-size: 0.9375rem; }
.reco b { color: var(--brand); }
.reco[hidden] { display: none; }

main.grid { display: grid; grid-template-columns: 260px minmax(0, 1fr); gap: 20px; margin-top: 20px; align-items: start; }
aside.filters { background: var(--surface); border: 1px solid var(--line); border-radius: 12px; padding: 16px; display: grid; gap: 14px; position: sticky; top: 12px; }
.field { display: grid; gap: 4px; }
.field > span { font-size: 0.8125rem; color: var(--muted); font-weight: 500; }
.field select { padding: 9px 10px; border: 1px solid var(--line); border-radius: 8px; background: var(--bg); }
.check { display: flex; align-items: center; gap: 8px; font-size: 0.9375rem; cursor: pointer; }
.check input { accent-color: var(--brand); width: 16px; height: 16px; }

.result-head { display: flex; justify-content: space-between; align-items: baseline; gap: 12px; flex-wrap: wrap; margin-bottom: 10px; }
.result-head h2 { margin: 0; font-size: 1.0625rem; }
.result-head .count { font-family: var(--font-data); color: var(--muted); font-size: 0.8125rem; }
.list { display: grid; gap: 10px; }
.card { background: var(--surface); border: 1px solid var(--line); border-radius: 12px; padding: 16px; display: grid; grid-template-columns: minmax(0, 1fr) auto; gap: 8px 16px; cursor: pointer; text-align: left; width: 100%; }
.card:hover { border-color: var(--brand); }
.card h3 { margin: 0; font-size: 1.0625rem; letter-spacing: -0.01em; }
.meta { color: var(--muted); font-size: 0.8125rem; display: flex; gap: 6px 12px; flex-wrap: wrap; margin-top: 2px; }
.tags { display: flex; gap: 6px; flex-wrap: wrap; margin-top: 8px; }
.tag { font-size: 0.75rem; padding: 2px 8px; border-radius: 4px; background: var(--bg); color: var(--muted); border: 1px solid var(--line); }
.tag.open { background: var(--ok-soft); color: var(--ok); border-color: transparent; font-weight: 600; }
.tag.closed { background: var(--bg); }
.tag.night { background: var(--brand-soft); color: var(--brand); border-color: transparent; }
.tag.slot { background: var(--alert-soft); color: var(--alert); border-color: transparent; }
.score { text-align: right; display: grid; align-content: start; justify-items: end; gap: 2px; }
.score b { font-family: var(--font-data); font-size: 1.75rem; line-height: 1; font-weight: 500; color: var(--brand); }
.score small { color: var(--muted); font-size: 0.6875rem; }
.bar { width: 72px; height: 4px; background: var(--line); border-radius: 2px; overflow: hidden; }
.bar i { display: block; height: 100%; background: var(--brand); }
.why { grid-column: 1 / -1; font-size: 0.8125rem; color: var(--muted); border-top: 1px solid var(--line); padding-top: 8px; }
.empty { background: var(--surface); border: 1px dashed var(--line); border-radius: 12px; padding: 32px 16px; text-align: center; color: var(--muted); }

.sheet-back { position: fixed; inset: 0; background: rgba(8, 20, 21, 0.55); display: grid; align-items: end; justify-items: center; z-index: 20; }
.sheet-back[hidden] { display: none; }
.sheet { background: var(--surface); width: min(640px, 100%); max-height: 90%; overflow: auto; border-radius: 16px 16px 0 0; padding: 22px max(16px, env(safe-area-inset-left, 0px)) calc(22px + env(safe-area-inset-bottom, 0px)); display: grid; gap: 14px; }
.sheet h2 { margin: 0; font-size: 1.25rem; }
.sheet dl { display: grid; grid-template-columns: 5.5em minmax(0, 1fr); gap: 6px 12px; margin: 0; font-size: 0.9375rem; }
.sheet dt { color: var(--muted); }
.sheet dd { margin: 0; }
.sheet .mono { font-family: var(--font-data); }
.slots { display: flex; flex-wrap: wrap; gap: 6px; }
.slot-btn { font-family: var(--font-data); font-size: 0.8125rem; padding: 6px 10px; border: 1px solid var(--line); background: var(--bg); border-radius: 6px; cursor: pointer; }
.slot-btn[aria-pressed="true"] { background: var(--brand); color: var(--brand-ink); border-color: var(--brand); }
.sheet form { display: grid; gap: 10px; }
.sheet input[type=text], .sheet input[type=tel], .sheet textarea { width: 100%; padding: 10px 12px; border: 1px solid var(--line); border-radius: 8px; background: var(--bg); }
.row { display: flex; gap: 8px; flex-wrap: wrap; }
.toast { background: var(--ok-soft); color: var(--ok); padding: 10px 14px; border-radius: 8px; font-weight: 500; }
.toast[hidden] { display: none; }
footer { margin-top: 28px; color: var(--muted); font-size: 0.8125rem; }

@media (max-width: 820px) {
  main.grid { grid-template-columns: minmax(0, 1fr); }
  aside.filters { position: static; grid-template-columns: 1fr 1fr; }
  aside.filters .wide { grid-column: 1 / -1; }
}
@media (max-width: 480px) {
  aside.filters { grid-template-columns: 1fr; }
  .card { grid-template-columns: minmax(0, 1fr); }
  .score { justify-items: start; text-align: left; grid-auto-flow: column; align-items: center; gap: 8px; }
  .score b { font-size: 1.25rem; }
}
</style>

<div class="wrap">
  <header class="top">
    <div class="brand">
      <h1>닥터매치</h1>
      <span>증상을 말하면 맞는 진료과와 지금 갈 수 있는 병원을 찾아드립니다</span>
    </div>
    <div class="emergency">가슴 통증, 호흡 곤란, 의식 저하 같은 응급 증상은 검색하지 말고 바로 <b>119</b>에 전화하세요.</div>
    <p class="sample-note" style="margin:0">프로토타입입니다. 아래 병원은 모두 가상의 예시 데이터이며 실제 병원이 아닙니다.</p>
    <section class="finder" aria-label="증상 검색">
      <label class="lbl" for="symptom">어디가 불편하신가요?</label>

        <input id="symptom" type="text" placeholder="예: 3일째 열이 나고 목이 아파요" autocomplete="off">
        <button class="btn" id="go" type="button">병원 찾기</button>
      </div>
      <div class="chips" id="chips" aria-label="자주 찾는 증상"></div>
      <div class="reco" id="reco" hidden></div>
    </section>
  </header>

  <main class="grid">
    <aside class="filters" aria-label="조건 필터">
      <label class="field"><span>지역</span><select id="region"></select></label>
      <label class="field"><span>진료과</span><select id="dept"></select></label>
      <label class="field"><span>정렬</span>
        <select id="sort">
          <option value="score">매칭 점수순</option>
          <option value="rating">평점순</option>
          <option value="wait">대기 짧은 순</option>
        </select>
      </label>
      <label class="check wide"><input type="checkbox" id="fOpen"> 지금 진료 중</label>
      <label class="check wide"><input type="checkbox" id="fNight"> 야간·주말 진료</label>
      <label class="check wide"><input type="checkbox" id="fSlot"> 오늘 예약 가능</label>
    </aside>

    <section aria-live="polite">
      <div class="result-head">
        <h2 id="resultTitle">전국 병원</h2>
        <span class="count" id="count"></span>
      </div>
      <div class="list" id="list"></div>
    </section>
  </main>
  <footer>매칭 점수 = 진료과 일치 + 증상 키워드 + 현재 진료 여부 + 예약 가능 + 평점. 의학적 진단이 아니며 참고용입니다.</footer>
</div>

<div class="sheet-back" id="sheetBack" hidden>
  <div class="sheet" role="dialog" aria-modal="true" aria-labelledby="sTitle">
    <div class="row" style="justify-content:space-between;align-items:start">
      <h2 id="sTitle"></h2>
      <button class="btn ghost" id="sClose" type="button">닫기</button>
    </div>
    <dl id="sInfo"></dl>
    <div>
      <div style="font-weight:600;margin-bottom:6px">오늘 예약 가능 시간</div>
      <div class="slots" id="sSlots"></div>
    </div>
    <form id="reqForm">
      <input id="pName" type="text" placeholder="환자 이름" required>
      <input id="pTel" type="tel" placeholder="연락처 (예: 010-0000-0000)" required>
      <textarea id="pNote" rows="2" placeholder="증상을 간단히 적어주세요"></textarea>
      <button class="btn" type="submit">예약 요청 보내기</button>
    </form>
    <div class="toast" id="toast" hidden></div>
  </div>
</div>

    ["강원","산들가정의원","가정의학과",9,18,13,0,4.2,15,["감기","열","혈압","피로"],["10:00","15:00"]],
    ["충북","별빛안과","안과",9,18,13,0,4.3,35,["눈","시력","충혈"],["11:00","14:00"]],
    ["충남","온담소아청소년과","소아청소년과",9,18,14,0,4.5,30,["기침","열","아이","예방접종"],["10:30","16:30"]],
    ["전북","한울내과","내과",9,18,13,0,4.2,25,["소화","복통","속쓰림","당뇨"],["09:30","14:00"]],
    ["전남","갯벌정형외과","정형외과",9,18,13,0,4.1,30,["어깨","관절","허리","무릎"],["13:00","16:00"]],
    ["경북","솔향이비인후과","이비인후과",9,18,13,0,4.3,25,["목","코","귀","기침"],["10:00","15:00"]],
    ["경남","다솜가정의학과","가정의학과",9,20,16,1,4.4,20,["감기","열","몸살","복통"],["17:00","18:30","19:30"]],
    ["제주","바람결내과","내과",9,18,13,0,4.5,25,["감기","열","소화","혈압"],["10:30","13:30"]],
    ["제주","돌담피부과","피부과",10,18,0,0,4.6,35,["아토피","두드러기","여드름"],["11:00","15:30"]],
    ["서울","다정치과","치과",9,19,15,0,4.7,45,["잇몸","충치","사랑니","턱"],["10:30","16:00"]],
    ["서울","편한잠신경과","신경과",10,19,15,0,4.6,55,["두통","불면","어지럼","저림"],["12:00","17:00"]]
  ];
  var HOSPITALS = SEED.map(function (s, i) {
    return { id: i, region: s[0], name: s[1], dept: s[2], open: s[3], close: s[4], satClose: s[5], sun: !!s[6], rating: s[7], wait: s[8], kw: s[9], slots: s[10],
      tel: "02-0000-" + String(1000 + i * 7), addr: s[0] + " 가상구 예시로 " + (10 + i * 3) + "번길" };
  });

  var $ = function (id) { return document.getElementById(id); };
  var state = { sel: null, slot: null, hint: [] };

  function pad(n) { return String(n).padStart(2, "0"); }
  function nowInfo() { var d = new Date(); return { day: d.getDay(), h: d.getHours() + d.getMinutes() / 60 }; }
  function isOpen(h) {
    var n = nowInfo();
    if (n.day === 0) return h.sun && n.h >= 9 && n.h < 18;
    if (n.day === 6) return h.satClose > 0 && n.h >= h.open && n.h < h.satClose;
    return n.h >= h.open && n.h < h.close;
  }
  function isNight(h) { return h.close >= 20 || h.sun; }
  function futureSlots(h) {
    var n = nowInfo();
    return h.slots.filter(function (t) { var p = t.split(":"); return +p[0] + p[1] / 60 > n.h; });
  }
  function hours(h) {
    return "평일 " + pad(h.open) + ":00–" + pad(h.close) + ":00 · 토 " + (h.satClose ? pad(h.open) + ":00–" + pad(h.satClose) + ":00" : "휴진") + " · 일 " + (h.sun ? "09:00–18:00" : "휴진");
  }

  // 증상 → 진료과 추정
  function analyze(text) {
    var found = {};
    RULES.forEach(function (r) {
      r.k.forEach(function (k) { if (text.indexOf(k) >= 0) { found[r.d] = (found[r.d] || 0) + 1; } });
    });
    var ranked = Object.keys(found).sort(function (a, b) { return found[b] - found[a]; });
    var words = [];
    RULES.forEach(function (r) { r.k.forEach(function (k) { if (text.indexOf(k) >= 0) words.push(k); }); });
    return { depts: ranked, words: words };
  }

  function score(h, a, deptFilter) {
    var s = 0, why = [];
    var target = a.depts.length ? a.depts : (deptFilter ? [deptFilter] : []);
    if (target.length) {
      var idx = target.indexOf(h.dept);
      if (idx === 0) { s += 50; why.push(h.dept + " 일치"); }
      else if (idx > 0) { s += 30; why.push("보조 진료과 " + h.dept); }
      else if (h.dept === "가정의학과" || h.dept === "내과") { s += 12; }
    } else { s += 25; }
    var hit = a.words.filter(function (w) { return h.kw.some(function (k) { return k.indexOf(w) >= 0 || w.indexOf(k) >= 0; }); });
    if (hit.length) { s += Math.min(20, hit.length * 10); why.push("증상 키워드 " + hit.slice(0, 2).join("·")); }
    if (isOpen(h)) { s += 15; why.push("지금 진료 중"); }
    if (futureSlots(h).length) { s += 10; why.push("오늘 예약 가능"); }
    s += Math.round((h.rating - 4) * 5);
    return { s: Math.max(0, Math.min(100, s)), why: why };
  }

  function render() {
    var text = $("symptom").value.trim();
    var a = analyze(text);
    var region = $("region").value, dept = $("dept").value;
    var reco = $("reco");
    if (a.depts.length) {
      reco.hidden = false;
      reco.innerHTML = "입력하신 증상은 <b>" + a.depts[0] + "</b> 진료를 우선 권합니다." + (a.depts.length > 1 ? " 함께 고려: " + a.depts.slice(1, 3).join(", ") + "." : "");
    } else if (text) {
      reco.hidden = false;
      reco.innerHTML = "증상에서 진료과를 정하지 못했습니다. <b>내과·가정의학과</b>에서 먼저 상담받거나 진료과를 직접 선택해 주세요.";
    } else { reco.hidden = true; }

    var rows = HOSPITALS.filter(function (h) {
      if (region && h.region !== region) return false;
      if (dept && h.dept !== dept) return false;
      if ($("fOpen").checked && !isOpen(h)) return false;
      if ($("fNight").checked && !isNight(h)) return false;
      if ($("fSlot").checked && !futureSlots(h).length) return false;
      return true;
    }).map(function (h) { var m = score(h, a, dept); return { h: h, s: m.s, why: m.why }; });

    var sort = $("sort").value;
    rows.sort(function (x, y) {
      if (sort === "rating") return y.h.rating - x.h.rating;
      if (sort === "wait") return x.h.wait - y.h.wait;
      return y.s - x.s;
    });

    $("resultTitle").textContent = (region || "전국") + (dept ? " · " + dept : "") + " 병원";
    $("count").textContent = rows.length + "곳";
    var list = $("list");
    list.innerHTML = "";
    if (!rows.length) {
      var e = document.createElement("div");
      e.className = "empty";
      e.textContent = "조건에 맞는 병원이 없습니다. 지역이나 필터를 줄여 보세요.";
      list.appendChild(e);
      return;
    }
    rows.forEach(function (r) {
      var h = r.h, open = isOpen(h), slots = futureSlots(h);
      var c = document.createElement("button");
      c.type = "button"; c.className = "card";
      var tags = '<span class="tag ' + (open ? "open" : "closed") + '">' + (open ? "진료 중" : "진료 종료") + "</span>" +
        (isNight(h) ? '<span class="tag night">야간·주말</span>' : "") +
        (slots.length ? '<span class="tag slot">오늘 ' + slots.length + "자리</span>" : "") +
        '<span class="tag">' + h.dept + "</span>";
      c.innerHTML =
        "<div><h3></h3><div class='meta'><span class='addr'></span><span>★ " + h.rating.toFixed(1) + "</span><span>대기 약 " + h.wait + "분</span></div><div class='tags'>" + tags + "</div></div>" +
        "<div class='score'><b>" + r.s + "</b><small>매칭</small><div class='bar'><i style='width:" + r.s + "%'></i></div></div>" +
        (r.why.length ? "<div class='why'>" + r.why.join(" · ") + "</div>" : "");
      c.querySelector("h3").textContent = h.name;
      c.querySelector(".addr").textContent = h.addr;
      c.addEventListener("click", function () { openSheet(h); });
      list.appendChild(c);
    });
  }

  function openSheet(h) {
    state.sel = h; state.slot = null;
    $("sTitle").textContent = h.name;
    var info = $("sInfo");
    info.innerHTML = "";
    [["진료과", h.dept], ["주소", h.addr], ["진료시간", hours(h)], ["전화", h.tel], ["평균 대기", "약 " + h.wait + "분"]].forEach(function (p) {
      var dt = document.createElement("dt"), dd = document.createElement("dd");
      dt.textContent = p[0]; dd.textContent = p[1];
      if (p[0] === "전화") dd.className = "mono";
      info.appendChild(dt); info.appendChild(dd);
    });
    var box = $("sSlots"); box.innerHTML = "";
    var fs = futureSlots(h);
    if (!fs.length) { box.textContent = "오늘 남은 예약 시간이 없습니다. 방문 접수는 병원에 문의해 주세요."; }
    fs.forEach(function (t) {
      var b = document.createElement("button");
      b.type = "button"; b.className = "slot-btn"; b.textContent = t; b.setAttribute("aria-pressed", "false");
      b.addEventListener("click", function () {
        state.slot = t;
        box.querySelectorAll(".slot-btn").forEach(function (x) { x.setAttribute("aria-pressed", x === b ? "true" : "false"); });
      });
      box.appendChild(b);
    });
    $("pNote").value = $("symptom").value;
    $("toast").hidden = true;
    $("sheetBack").hidden = false;
  }
  function closeSheet() { $("sheetBack").hidden = true; }

  // 초기화
  $("region").innerHTML = '<option value="">전국</option>' + REGIONS.map(function (r) { return "<option>" + r + "</option>"; }).join("");
  $("dept").innerHTML = '<option value="">전체 진료과</option>' + DEPTS.map(function (d) { return "<option>" + d + "</option>"; }).join("");
  CHIPS.forEach(function (t) {
    var b = document.createElement("button");
    b.type = "button"; b.className = "chip"; b.textContent = t;
    b.addEventListener("click", function () { $("symptom").value = t; render(); });
    $("chips").appendChild(b);
  });
  ["region","dept","sort","fOpen","fNight","fSlot"].forEach(function (id) { $(id).addEventListener("change", render); });
  $("go").addEventListener("click", render);
  $("symptom").addEventListener("keydown", function (e) { if (e.key === "Enter") render(); });
  $("sClose").addEventListener("click", closeSheet);
  $("sheetBack").addEventListener("click", function (e) { if (e.target === $("sheetBack")) closeSheet(); });
  document.addEventListener("keydown", function (e) { if (e.key === "Escape") closeSheet(); });
  $("reqForm").addEventListener("submit", function (e) {
    e.preventDefault();
    var t = $("toast");
    t.hidden = false;
    t.textContent = state.slot
      ? "예시 화면입니다. 실제로 전송되지 않았습니다. (" + state.sel.name + " · 오늘 " + state.slot + ")"
      : "예시 화면입니다. 실제로 전송되지 않았습니다. 시간을 고르면 희망 시간이 함께 표시됩니다.";
  });

  $("symptom").value = "열이 나고 목이 아파요";
  render();
})();
</script>
